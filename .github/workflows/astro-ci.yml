name: Astro CI

on:
  push:
    branches:
      - main
      - feature/astro-migration
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: astro-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type check and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Astro diagnostics
        run: npm run check

      - name: Build static site
        run: npm run build
